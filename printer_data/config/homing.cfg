# Note you may need to add the following to your printer.cfg somewhere (without the comments of course) for the Kinematic position stuff below to work.
#[force_move]
#enable_force_move: True

[gcode_macro _HOME_X]
gcode:
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set home_current = 0.45 %}

    # Reduce current for sensorless homing
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current}

    # Home X axis
    G28.1 X
    G91
    G1 X5 F1800    # Move off endstop slightly
    M400

    # Optional second pass for precision
    G90
    G28.1 X

    # Restore currents
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}


[gcode_macro _HOME_Y]
gcode:
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set home_current = 0.45 %}

    # Reduce current for sensorless homing
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current}

    # Home Y axis
    G28.1 Y
    G91
    G1 Y5 F1800    # Move off endstop slightly
    M400

    # Optional second pass for precision
    G90
    G28.1 Y

    # Restore currents
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}


[gcode_macro _HOME_XY]
gcode:
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set home_current = 0.45 %}

    # Reduce current for sensorless homing
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current}

    # Home both axes
    G28.1 X Y
    G91
    G1 X5 Y5 F1800    # Move slightly off endstops
    M400

    # Optional second pass for precision
    G90
    G28.1 X Y

    # Restore currents
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}


[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # Temporarily define Z position so relative moves are safe
  SET_KINEMATIC_POSITION Z=5

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}

  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}

  {% if home_all or 'Z' in params %}
    # Move to bed center after XY homing
    G1 X100 Y100 F6000
    G28.1 Z
    G1 Z10 F1500    # Optional safe Z after homing
  {% endif %}


[gcode_macro G28]
description: Smart CoreXY homing macro using sensorless homing
rename_existing: G28.1
gcode:
    {% set axes = params %}
    {% if 'X' in axes and 'Y' in axes %}
        _HOME_XY
    {% elif 'X' in axes %}
        _HOME_X
    {% elif 'Y' in axes %}
        _HOME_Y
    {% elif 'Z' in axes %}
        G28.1 Z
    {% else %}
        # Full home sequence
        _HOME_XY
        G1 X100 Y100 F6000
        G28.1 Z
    {% endif %}
