# Note you may need to add the following to your printer.cfg somewhere (without the comments of course) for the Kinematic position stuff below to work.
#[force_move]
#enable_force_move: True

[gcode_macro _HOME_X]
gcode:
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set home_current = 0.45 %}
    
    # Reduce current for stallguard sensitivity
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current}

    G91                      ; Relative moves
    G1 X-10 F1200            ; Nudge away from potential stall
    M400
    G4 P200                  ; Brief delay to clear StallGuard registers
    G90
    G28 X                    ; Home X
    G91
    G1 X5 F1800              ; Move off the endstop
    M400

    # Optional second home for precision
    G90
    G28 X

    # Restore run current
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}


[gcode_macro _HOME_Y]
gcode:
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set home_current = 0.45 %}
    
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current}

    G91
    G1 Y-10 F1200            ; Clear stall register
    M400
    G4 P200
    G90
    G28 Y
    G91
    G1 Y-5 F1800
    M400
    G90
    G28 Y                    ; Optional second pass
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}


[gcode_macro _HOME_XY]
gcode:
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set home_current = 0.45 %}

    # Reduce current for both motors
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current}

    G91
    G1 X-10 Y-10 F1200       ; Small pre-move to release tension
    M400
    G4 P200                  ; Wait 200ms
    G90
    G28 X Y                  ; Home both axes
    G91
    G1 X5 Y5 F1800           ; Move away from corners
    M400
    G4 P100

    # Optional precise re-home
    G90
    G28 X Y

    # Restore currents
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}


[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  SET_KINEMATIC_POSITION Z=1 #SET_HOMED=Z
  G1 Z4 F1200

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}
  
  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}
  
  {% if home_all or 'Z' in params %}

    G90
    G1 X150 Y150 F15000

    G28 Z

    G1 Z10 F1500
  {% endif %}


[gcode_macro G28]
description: Smart homing macro using sensorless homing
rename_existing: G28.1
gcode:
    {% set axes = params %}
    {% if 'X' in axes and 'Y' in axes %}
        _HOME_XY
    {% elif 'X' in axes %}
        _HOME_X
    {% elif 'Y' in axes %}
        _HOME_Y
    {% elif 'Z' in axes %}
        G28.1 Z
    {% else %}
        # Default full home if no axis specified
        _HOME_XY
        G28.1 Z
    {% endif %}
