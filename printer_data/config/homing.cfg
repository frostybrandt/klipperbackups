# Note you may need to add the following to your printer.cfg somewhere (without the comments of course) for the Kinematic position stuff below to work.
#[force_move]
#enable_force_move: True

[gcode_macro _HOME_X]
description: Home X axis (internal use)
gcode:
    {action_respond_info("Homing X axis...")}
    # Voron 2.4 typically uses a single X endstop
    G90
    G1 X305 F6000      # Move to X endstop position (adjust based on your build)
    SET_KINEMATIC_POSITION X=305  # Set position after homing (adjust to your printer size)
    {action_respond_info("X axis homed")}

[gcode_macro _HOME_Y]
description: Home Y axis (internal use)
gcode:
    {action_respond_info("Homing Y axis...")}
    # Voron 2.4 typically uses a single Y endstop
    G90
    G1 Y305 F6000      # Move to Y endstop position (adjust based on your build)
    SET_KINEMATIC_POSITION Y=305  # Set position after homing (adjust to your printer size)
    {action_respond_info("Y axis homed")}

[gcode_macro _HOME_Z]
description: Home Z axis (internal use)
gcode:
    {action_respond_info("Homing Z axis...")}
    # Lift Z slightly first to avoid crashes
    G91
    G1 Z5 F1200
    G90
    
    # Home Z using probe
    G28 Z
    {action_respond_info("Z axis homed")}

[gcode_macro _HOME_ALL]
description: Home all axes in sequence (internal use)
gcode:
    {action_respond_info("Starting homing sequence...")}
    
    # Home Z first to prevent crashes (common Voron practice)
    _HOME_Z
    
    # Then home X and Y
    _HOME_X
    _HOME_Y
    
    # Move to safe position after homing
    G90
    G1 X150 Y150 Z10 F6000
    
    {action_respond_info("All axes homed successfully!")}