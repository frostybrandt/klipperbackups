# Note you may need to add the following to your printer.cfg somewhere (without the comments of course) for the Kinematic position stuff below to work.
#[force_move]
#enable_force_move: True

[gcode_macro G28]
description: Home all axes or specified axes (CoreXY compatible)
gcode:
    {% if params.X is defined or params.Y is defined or params.Z is defined %}
        # Home specific axes - but X and Y must be homed together on CoreXY
        {% if (params.X|default(0)|int or params.Y|default(0)|int) %}
            {action_respond_info("CoreXY: Homing X and Y together")}
            G28 X Y
        {% elif params.Z|default(0)|int %}
            G28 Z
        {% endif %}
    {% else %}
        # Home all axes
        _HOME_ALL
    {% endif %}

[gcode_macro _HOME_XY]
description: Home X and Y axes together (CoreXY required)
gcode:
    {action_respond_info("Homing X and Y axes...")}
    
    # Save current state
    SAVE_GCODE_STATE NAME=homing_state
    
    # Set absolute positioning
    G90
    
    # Move to safe position for homing (center of bed)
    G1 X150 Y150 Z10 F6000
    
    # Home X and Y together - this is the correct CoreXY way
    G28 X Y
    
    # Set position after homing (adjust to your printer size)
    # For a 300mm Voron 2.4:
    SET_KINEMATIC_POSITION X=150 Y=150
    
    {action_respond_info("X and Y axes homed")}
    
    # Restore state
    RESTORE_GCODE_STATE NAME=homing_state

[gcode_macro _HOME_Z]
description: Home Z axis
gcode:
    {action_respond_info("Homing Z axis...")}
    
    # Lift Z slightly first for safety
    G91
    G1 Z5 F1200
    G90
    
    # Home Z using probe or endstop
    G28 Z
    
    {action_respond_info("Z axis homed")}

[gcode_macro _HOME_ALL]
description: Home all axes in correct sequence
gcode:
    {action_respond_info("Starting homing sequence...")}
    
    # Home Z first (safest for Voron)
    _HOME_Z
    
    # Then home X and Y together
    _HOME_XY
    
    # Move to safe position after homing
    G1 X150 Y150 Z10 F6000
    
    {action_respond_info("All axes homed successfully!")}

# Individual homing commands that work with CoreXY
[gcode_macro HOME_XY]
description: Home X and Y axes together
gcode:
    _HOME_XY

[gcode_macro HOME_Z]
description: Home Z axis only
gcode:
    _HOME_Z