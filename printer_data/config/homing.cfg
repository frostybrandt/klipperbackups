# Note you may need to add the following to your printer.cfg somewhere (without the comments of course) for the Kinematic position stuff below to work.
#[force_move]
#enable_force_move: True

[gcode_macro _HOME_X]
gcode:
    # Lower current for reliable stall detection
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.40

    G91                 # relative
    G1 X-5 F2000        # move slightly away
    M400
    G4 P100             # 100 ms pause

    G90                 # absolute
    G28.1 X             # perform the hardware home

    G91
    G1 X5 F2000         # move away from rail
    M400

    # Restore normal current
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings['tmc2209 stepper_x'].run_current}




[gcode_macro _HOME_Y]
gcode:
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.40

    G91
    G1 Y-5 F2000
    M400
    G4 P100

    G90
    G28.1 Y

    G91
    G1 Y5 F2000
    M400

    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings['tmc2209 stepper_y'].run_current}


[gcode_macro _HOME_Z]
gcode:
    G90
    G1 X100 Y100 F5000   # move center of bed
    G28.1 Z

[gcode_macro G28]
description: Basic sensorless homing controller
rename_existing: G28.1
gcode:
    {% if 'X' in params and 'Y' in params and 'Z' in params %}
        _HOME_XY
        _HOME_Z
    {% elif 'X' in params and 'Y' in params %}
        _HOME_XY
    {% elif 'X' in params %}
        _HOME_X
    {% elif 'Y' in params %}
        _HOME_Y
    {% elif 'Z' in params %}
        _HOME_Z
    {% else %}
        _HOME_XY
        _HOME_Z
    {% endif %}


[homing_override]
axes: xyz
set_position_z: 0
gcode:
   QUERY_ENDSTOPS
   G90
   _SAFE_Z_MOVE
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}
  
  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}
  
  {% if home_all or 'Z' in params %}
    _HOME_Z
  {% endif %}

[gcode_macro _SAFE_Z_MOVE]
gcode:
  {% if printer.query_endstops.last_query["z"] %}
  G0 Z-5 F600
  {% else %}
  G0 Z5 F600
  {% endif %}
